<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Unilorin eHospital</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <h2><a href="index.html">Unilorin eHospital</a></h2>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="login.html" class="nav-link">Login</a>
                    </li>
                </ul>
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h1 class="form-title">Create Account</h1>
            <form id="signup-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="gender" class="form-label">Gender</label>
                        <select id="gender" class="form-control" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dob" class="form-label">Date of Birth</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="address" class="form-label">Home Address</label>
                    <textarea id="address" class="form-control" rows="3" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="role" class="form-label">Role</label>
                        <select id="role" class="form-control" required>
                            <option value="">Select Role</option>
                            <option value="student">Student</option>
                            <option value="staff">Staff</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="idNumber" class="form-label" id="idLabel">Matric Number</label>
                        <input type="text" id="idNumber" class="form-control" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="faculty" class="form-label">Faculty</label>
                        <select id="faculty" class="form-control" required>
                            <option value="">Select Faculty</option>
                            <option value="arts">Arts</option>
                            <option value="education">Education</option>
                            <option value="engineering">Engineering and Technology</option>
                            <option value="law">Law</option>
                            <option value="life-sciences">Life Sciences</option>
                            <option value="management-sciences">Management Sciences</option>
                            <option value="physical-sciences">Physical Sciences</option>
                            <option value="social-sciences">Social Sciences</option>
                            <option value="agriculture">Agriculture</option>
                            <option value="clinical-sciences">Clinical Sciences</option>
                            <option value="basic-medical-sciences">Basic Medical Sciences</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="department" class="form-label">Department</label>
                        <input type="text" id="department" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                    <small class="form-text">A verification email will be sent to this address</small>
                </div>

                <div class="form-group">
                    <label for="nin" class="form-label">National Identification Number (NIN)</label>
                    <input type="text" id="nin" class="form-control" maxlength="11" required>
                    <small class="form-text">Only numbers allowed</small>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" required>
                        <small class="form-text">Must contain uppercase, lowercase, number and special character</small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-check">
                        <input type="checkbox" id="agreeTerms" class="form-check-input" required>
                        <label for="agreeTerms" class="form-check-label">I agree to the Terms and Conditions</label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Create Account</button>
                    <a href="login.html" class="btn btn-outline">Already have an account? Login</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <p>&copy; 2026 University of Ilorin eHospital. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>

</html>
