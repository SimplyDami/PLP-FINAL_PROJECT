<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - Unilorin eHospital</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <h2><a href="index.html">Unilorin eHospital</a></h2>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="login.html?role=doctor" class="nav-link">Doctor Login</a>
                    </li>
                </ul>
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h1 class="form-title">Doctor Registration</h1>
            <form id="doctor-signup-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="gender" class="form-label">Gender</label>
                        <select id="gender" class="form-control" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dob" class="form-label">Date of Birth</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="address" class="form-label">Home Address</label>
                    <textarea id="address" class="form-control" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="staffNumber" class="form-label">Staff Number</label>
                    <input type="text" id="staffNumber" class="form-control" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="specialization" class="form-label">Specialization</label>
                        <select id="specialization" class="form-control" required>
                            <option value="">Select Specialization</option>
                            <option value="general">General Practitioner</option>
                            <option value="cardiology">Cardiology</option>
                            <option value="pediatrics">Pediatrics</option>
                            <option value="surgery">Surgery</option>
                            <option value="orthopedics">Orthopedics</option>
                            <option value="neurology">Neurology</option>
                            <option value="psychiatry">Psychiatry</option>
                            <option value="dermatology">Dermatology</option>
                            <option value="ophthalmology">Ophthalmology</option>
                            <option value="dentistry">Dentistry</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="department" class="form-label">Department</label>
                        <input type="text" id="department" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                    <small class="form-text">A verification email will be sent to this address</small>
                </div>

                <div class="form-group">
                    <label for="nin" class="form-label">National Identification Number (NIN)</label>
                    <input type="text" id="nin" class="form-control" maxlength="11" required>
                    <small class="form-text">Only numbers allowed</small>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="licenseNumber" class="form-label">Medical License Number</label>
                    <input type="text" id="licenseNumber" class="form-control" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" required>
                        <small class="form-text">Must contain uppercase, lowercase, number and special character</small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-check">
                        <input type="checkbox" id="agreeTerms" class="form-check-input" required>
                        <label for="agreeTerms" class="form-check-label">I agree to the Terms and Conditions</label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Register as Doctor</button>
                    <a href="login.html?role=doctor" class="btn btn-outline">Already registered? Login</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <p>&copy; 2026 University of Ilorin eHospital. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const doctorSignupForm = document.getElementById('doctor-signup-form');

            if (doctorSignupForm) {
                doctorSignupForm.addEventListener('submit', function (e) {
                    e.preventDefault();

                    // Get form values
                    const fullName = document.getElementById('fullName').value;
                    const gender = document.getElementById('gender').value;
                    const dob = document.getElementById('dob').value;
                    const address = document.getElementById('address').value;
                    const staffNumber = document.getElementById('staffNumber').value;
                    const specialization = document.getElementById('specialization').value;
                    const department = document.getElementById('department').value;
                    const email = document.getElementById('email').value;
                    const nin = document.getElementById('nin').value;
                    const phone = document.getElementById('phone').value;
                    const licenseNumber = document.getElementById('licenseNumber').value;
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    const agreeTerms = document.getElementById('agreeTerms').checked;

                    // Validation
                    if (!fullName || !gender || !dob || !address || !staffNumber || !specialization ||
                        !department || !email || !nin || !phone || !licenseNumber || !password || !confirmPassword) {
                        showAlert('Please fill in all required fields', 'error');
                        return;
                    }

                    if (!agreeTerms) {
                        showAlert('You must agree to the terms and conditions', 'error');
                        return;
                    }

                    if (!validateEmail(email)) {
                        showAlert('Please enter a valid email address', 'error');
                        return;
                    }

                    if (!validateNIN(nin)) {
                        showAlert('NIN must contain only numbers', 'error');
                        return;
                    }

                    if (!validatePhone(phone)) {
                        showAlert('Please enter a valid phone number', 'error');
                        return;
                    }

                    if (!validatePassword(password)) {
                        showAlert('Password must be at least 8 characters and contain uppercase, lowercase, number and special character', 'error');
                        return;
                    }

                    if (password !== confirmPassword) {
                        showAlert('Passwords do not match', 'error');
                        return;
                    }

                    // Simulate doctor registration and email verification
                    showAlert('Doctor registration successful! A verification email has been sent to your email address.', 'success');

                    // Redirect to doctor dashboard after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'doctor-dashboard.html';
                    }, 3000);
                });
            }
        });
    </script>
</body>

</html>
